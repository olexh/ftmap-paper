    why: The КАТОТТГ code, constant, with a stray space inside it.
  - id: c21
    header: addressPostCode
    role: property
    answer: Address:postalCode
    why: «08150», constant.
  - id: c22
    header: addressAdminUnitL1
    role: property
    answer: Address:country
    accept_decline: true
    why: «Україна», constant.
  - id: c23
    header: addressAdminUnitL2
    role: property
    answer: Address:region
    why: «Київська область», constant.
  - id: c24
    header: addressAdminUnitL3
    role: unmappable
    why: The raion.
  - id: c25
    header: addressAdminUnitL4
    role: unmappable
    why: The hromada.
  - id: c26
    header: addressPostName
    role: property
    answer: Address:city
    why: «Боярка», constant.
  - id: c27
    header: addressThoroughfare
    role: key+property
    answer: Address:street
    why: «Михайла Грушевського», constant.
  - id: c28
    header: addressLocatorDesignator
    role: key+property
    answer: Address:full
    accept: [Address:street, Address:summary]
    why: The building number, constant.
  - id: c29
    header: addressLocatorBuilding
    role: not-data
    why: Constant filler.
  - id: c30
    header: addressLocatorName
    role: key+property
    answer: PublicBody:name
    accept: [Address:summary]
    why: >-
      «Боярська міська рада» on every row: the council, named as the venue.
      The field is the format's venue name, so keeping it on the Address as
      its summary is also right.
  - id: c31
    header: openingHours
    role: not-data
    why: The literal `null`.
  - id: c32
